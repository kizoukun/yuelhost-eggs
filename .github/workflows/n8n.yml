name: n8n yolk

on:
  push:
    branches: [main]
    paths:
      - "yolks/n8n/**"
      - ".github/workflows/n8n.yml"
  schedule:
    # Pick up new stable n8n releases.
    - cron: "29 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "n8n version, e.g. 2.38.7 (blank = latest stable release)"
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yolks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve n8n version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          latest=$(gh api repos/n8n-io/n8n/releases/latest --jq .tag_name)
          latest="${latest#n8n@}"
          version="${INPUT_VERSION:-$latest}"
          version="${version#n8n@}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected n8n version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:n8n_$version"
            # Only the latest stable release moves the floating tag used by the egg.
            if [ "$version" = "$latest" ]; then echo "$IMAGE:n8n"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip scheduled run if this release is already published
        id: check
        if: github.event_name == 'schedule'
        run: |
          if docker manifest inspect "$IMAGE:n8n_${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v7
        if: steps.check.outputs.skip != 'true'
        with:
          context: yolks/n8n
          platforms: linux/amd64
          build-args: N8N_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
          push: true
