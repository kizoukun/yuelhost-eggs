name: Nginx PHP yolk

on:
  push:
    branches: [main]
    paths:
      - "yolks/nginx_php/**"
      - ".github/workflows/nginx-php.yml"
  schedule:
    # Weekly rebuild to pick up Alpine security updates.
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yolks

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            package: "82"
            alpine: "3.22"
          - php: "8.3"
            package: "83"
            alpine: "3.24"
          - php: "8.4"
            package: "84"
            alpine: "3.24"
          - php: "8.5"
            package: "85"
            alpine: "3.24"
    name: nginx_php_${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: yolks/nginx_php
          platforms: linux/amd64
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine }}
            PHP_VERSION=${{ matrix.package }}
          tags: ${{ env.IMAGE }}:nginx_php_${{ matrix.php }}
          pull: true
          push: true
