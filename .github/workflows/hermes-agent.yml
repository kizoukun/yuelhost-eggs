name: Hermes Agent yolk

on:
  push:
    branches: [main]
    paths:
      - "yolks/hermes_agent/**"
      - ".github/workflows/hermes-agent.yml"
  schedule:
    # Pick up new Hermes Agent releases.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Hermes Agent release tag, e.g. v2026.9.7 (blank = latest release)"
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yolks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Hermes Agent version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          latest=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
          version="${INPUT_VERSION:-$latest}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:hermes_agent_$version"
            # Only the newest release moves the floating tag used by the egg.
            if [ "$version" = "$latest" ]; then echo "$IMAGE:hermes_agent"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip scheduled run if this release is already published
        id: check
        if: github.event_name == 'schedule'
        run: |
          if docker manifest inspect "$IMAGE:hermes_agent_${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v7
        if: steps.check.outputs.skip != 'true'
        with:
          context: yolks/hermes_agent
          platforms: linux/amd64
          build-args: HERMES_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
          push: true
