worker_processes auto;
pid /home/container/tmp/nginx.pid;
daemon off;

error_log /home/container/logs/error.log warn;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /home/container/tmp/client_body;
    proxy_temp_path /home/container/tmp/proxy;
    fastcgi_temp_path /home/container/tmp/fastcgi;
    uwsgi_temp_path /home/container/tmp/uwsgi;
    scgi_temp_path /home/container/tmp/scgi;

    # Access logs go to a file only, to keep the server console readable.
    access_log /home/container/logs/access.log;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    include /home/container/nginx/conf.d/*.conf;
}
